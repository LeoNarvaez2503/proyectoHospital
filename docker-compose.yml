services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5076:5076"
    environment:
      ConnectionStrings__cn: "Server=sqlserver;Database=BDHospital;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - sqlserver
    volumes:
      - app-keys:/app/keys

volumes:
  sqlserver-data:
  app-keys:
