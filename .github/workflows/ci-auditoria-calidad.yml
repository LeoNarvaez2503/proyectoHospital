name: CI -- AuditoriaCalidad

on:
  push:
    branches:
      - AuditoriaCalidad
      - AuditoriaCalidad_Cypress
  pull_request:
    branches:
      - AuditoriaCalidad
      - main

jobs:
  # ============================================================
  # JOB 1: BUILD & UNIT TESTS (xUnit + Coverlet)
  # SQL Server levantado como service container
  # ============================================================
  build-and-test:
    name: Build & xUnit Tests
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Hospital123!CI"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Hospital123!CI' -C -Q 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ---------------------------------------------------------
      # Instalar sqlcmd (mssql-tools18) explicitamente en el runner
      # para evitar el error "exit code 127: command not found"
      # ---------------------------------------------------------
      - name: Install sqlcmd (mssql-tools18)
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev 2>/dev/null
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      # ---------------------------------------------------------
      # Esperar que SQL Server arranque y crear BDHospitalF
      # ---------------------------------------------------------
      - name: Wait for SQL Server and initialize database
        run: |
          echo "Waiting for SQL Server to be ready..."
          for i in $(seq 1 30); do
            sqlcmd -S localhost,1433 -U sa -P 'Hospital123!CI' -C -Q "SELECT 1" > /dev/null 2>&1 && echo "SQL Server is ready!" && break
            echo "Attempt $i/30 — not ready yet, waiting 5s..."
            sleep 5
          done
          echo "Creating BDHospitalF database..."
          sqlcmd -S localhost,1433 -U sa -P 'Hospital123!CI' -C -Q "
            IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'BDHospitalF')
            BEGIN CREATE DATABASE BDHospitalF END"
          echo "Running init.sql (tables & stored procedures)..."
          sed 's/CREATE DATABASE BDHospital/-- CREATE DATABASE BDHospitalF/g; s/USE BDHospital/USE BDHospitalF/g' Login/Login/init.sql > /tmp/init_ci.sql
          sqlcmd -S localhost,1433 -U sa -P 'Hospital123!CI' -C -d BDHospitalF -i /tmp/init_ci.sql || true
          echo "Database initialization complete."

      # ---------------------------------------------------------
      # appsettings.json de CI (sobreescribe el placeholder del repo)
      # ---------------------------------------------------------
      - name: Write CI appsettings.json for tests
        run: |
          cat > AreadePruebas/ProyectoHospital.Tests/appsettings.json << 'APPSETTINGS'
          {
            "ConnectionStrings": {
              "cn": "Server=localhost,1433;Database=BDHospitalF;User Id=sa;Password=Hospital123!CI;TrustServerCertificate=True;"
            }
          }
          APPSETTINGS
          cat AreadePruebas/ProyectoHospital.Tests/appsettings.json

      # ---------------------------------------------------------
      # Build y Tests
      # ---------------------------------------------------------
      - name: Restore dependencies
        run: |
          dotnet restore Login/Login.sln
          dotnet restore AreadePruebas/ProyectoHospital.Tests/ProyectoHospital.Tests.csproj

      - name: Build solution
        run: |
          dotnet build Login/Login.sln \
            --configuration Release \
            --no-restore \
            /p:NoWarn="CS8618"

      - name: Create TestResults directory
        run: mkdir -p "$GITHUB_WORKSPACE/TestResults"

      - name: Run xUnit Tests with Coverage
        run: |
          dotnet test AreadePruebas/ProyectoHospital.Tests/ProyectoHospital.Tests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory "$GITHUB_WORKSPACE/TestResults" \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput="$GITHUB_WORKSPACE/TestResults/coverage.opencover.xml" \
            /p:Exclude="[*.Tests]*" \
            /p:NoWarn="CS8618"

      - name: Upload Test Results (TRX)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults/*.trx

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ github.workspace }}/TestResults/coverage.opencover.xml

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          if [ -f "$GITHUB_WORKSPACE/TestResults/test-results.trx" ]; then
            TOTAL=$(grep -c '<UnitTestResult' "$GITHUB_WORKSPACE/TestResults/test-results.trx" || echo "?")
            PASSED=$(grep -c 'outcome="Passed"' "$GITHUB_WORKSPACE/TestResults/test-results.trx" || echo "?")
            echo "| xUnit Tests | ✅ $PASSED/$TOTAL pasados |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| xUnit Tests | ❌ No se generó el archivo .trx |" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================
  # JOB 2: SONARQUBE ANALYSIS (servidor local via ngrok/túnel)
  # Apunta a SONAR_HOST_URL definido como secret en GitHub
  # projectKey = proyectoHospital (igual que .sonarlint/Login.json)
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Hospital123!CI"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Hospital123!CI' -C -Q 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install sqlcmd (mssql-tools18)
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev 2>/dev/null
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Write CI appsettings.json for tests
        run: |
          cat > AreadePruebas/ProyectoHospital.Tests/appsettings.json << 'APPSETTINGS'
          {
            "ConnectionStrings": {
              "cn": "Server=localhost,1433;Database=BDHospitalF;User Id=sa;Password=Hospital123!CI;TrustServerCertificate=True;"
            }
          }
          APPSETTINGS

      - name: Wait for SQL Server and initialize database
        run: |
          for i in $(seq 1 30); do
            sqlcmd -S localhost,1433 -U sa -P 'Hospital123!CI' -C -Q "SELECT 1" > /dev/null 2>&1 && break
            sleep 5
          done
          sqlcmd -S localhost,1433 -U sa -P 'Hospital123!CI' -C -Q "
            IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'BDHospitalF')
            BEGIN CREATE DATABASE BDHospitalF END"
          sed 's/CREATE DATABASE BDHospital/-- CREATE DATABASE BDHospitalF/g; s/USE BDHospital/USE BDHospitalF/g' Login/Login/init.sql > /tmp/init_ci.sql
          sqlcmd -S localhost,1433 -U sa -P 'Hospital123!CI' -C -d BDHospitalF -i /tmp/init_ci.sql || true

      - name: Restore dependencies
        run: |
          dotnet restore Login/Login.sln
          dotnet restore AreadePruebas/ProyectoHospital.Tests/ProyectoHospital.Tests.csproj

      # SonarQube local: projectKey = "proyectoHospital" (igual que .sonarlint/Login.json)
      - name: SonarQube Begin Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          dotnet sonarscanner begin \
            /k:"proyectoHospital" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.opencover.reportsPaths="$GITHUB_WORKSPACE/TestResults/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**,**/*.Tests/**" \
            /d:sonar.coverage.exclusions="**/*.Tests/**" \
            /d:sonar.branch.name="${{ github.ref_name }}"

      - name: Build for SonarQube
        run: dotnet build Login/Login.sln --configuration Release /p:NoWarn="CS8618"

      - name: Run Tests for Coverage
        run: |
          mkdir -p "$GITHUB_WORKSPACE/TestResults"
          dotnet test AreadePruebas/ProyectoHospital.Tests/ProyectoHospital.Tests.csproj \
            --configuration Release \
            --no-restore \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput="$GITHUB_WORKSPACE/TestResults/coverage.opencover.xml" \
            /p:NoWarn="CS8618"

      - name: SonarQube End Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  # ============================================================
  # JOB 3: DOCKER IMAGE BUILD
  # ============================================================
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: proyectohospital:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`proyectohospital:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
