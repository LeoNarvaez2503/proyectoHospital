name: CI -- AuditoriaCalidad

on:
  push:
    branches:
      - AuditoriaCalidad
      - AuditoriaCalidad_Cypress
  pull_request:
    branches:
      - AuditoriaCalidad
      - main

jobs:
  # ============================================================
  # JOB 1: BUILD & xUnit TESTS (con Coverlet para cobertura)
  # ============================================================
  build-and-test:
    name: Build & xUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # -------------------------------------------------------
      # Los Integration Tests usan try/catch y pasan sin BD real.
      # Solo necesitamos el appsettings.json con la cadena correcta
      # para satisfacer la asercion: .Contain("BDHospitalF")
      # -------------------------------------------------------
      - name: Write CI appsettings.json for tests
        run: |
          cat > AreadePruebas/ProyectoHospital.Tests/appsettings.json << 'APPSETTINGS'
          {
            "ConnectionStrings": {
              "cn": "Server=localhost,1433;Database=BDHospitalF;User Id=sa;Password=Hospital123!CI;TrustServerCertificate=True;"
            }
          }
          APPSETTINGS
          echo "--- appsettings.json escrito ---"
          cat AreadePruebas/ProyectoHospital.Tests/appsettings.json

      - name: Restore dependencies
        run: |
          dotnet restore Login/Login.sln
          dotnet restore AreadePruebas/ProyectoHospital.Tests/ProyectoHospital.Tests.csproj

      - name: Build solution
        run: |
          dotnet build Login/Login.sln \
            --configuration Release \
            --no-restore \
            /p:NoWarn="CS8618"

      - name: Run xUnit Tests with Coverage
        run: |
          mkdir -p "$GITHUB_WORKSPACE/TestResults"
          dotnet test AreadePruebas/ProyectoHospital.Tests/ProyectoHospital.Tests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory "$GITHUB_WORKSPACE/TestResults" \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput="$GITHUB_WORKSPACE/TestResults/coverage.opencover.xml" \
            /p:Exclude="[*.Tests]*" \
            /p:NoWarn="CS8618"

      - name: Upload Test Results (TRX)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults/*.trx

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ github.workspace }}/TestResults/coverage.opencover.xml

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          TRX="$GITHUB_WORKSPACE/TestResults/test-results.trx"
          if [ -f "$TRX" ]; then
            TOTAL=$(grep -c '<UnitTestResult' "$TRX" 2>/dev/null || echo "?")
            PASSED=$(grep -c 'outcome="Passed"' "$TRX" 2>/dev/null || echo "?")
            FAILED=$(grep -c 'outcome="Failed"' "$TRX" 2>/dev/null || echo "0")
            echo "| xUnit Tests | ✅ $PASSED/$TOTAL pasados ($FAILED fallidos) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| xUnit Tests | ❌ No se generó el archivo .trx |" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================
  # JOB 2: SONARQUBE ANALYSIS (servidor local via secret SONAR_HOST_URL)
  # projectKey = "proyectoHospital" (igual que .sonarlint/Login.json)
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Write CI appsettings.json for tests
        run: |
          cat > AreadePruebas/ProyectoHospital.Tests/appsettings.json << 'APPSETTINGS'
          {
            "ConnectionStrings": {
              "cn": "Server=localhost,1433;Database=BDHospitalF;User Id=sa;Password=Hospital123!CI;TrustServerCertificate=True;"
            }
          }
          APPSETTINGS

      - name: Restore dependencies
        run: |
          dotnet restore Login/Login.sln
          dotnet restore AreadePruebas/ProyectoHospital.Tests/ProyectoHospital.Tests.csproj

      - name: SonarCloud Begin Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          SONAR_URL="${SONAR_HOST_URL:-https://sonarcloud.io}"
          ORG="${SONAR_ORGANIZATION:-leonarvaez2503}"
          dotnet sonarscanner begin \
            /k:"proyectoHospital" \
            /o:"$ORG" \
            /d:sonar.host.url="$SONAR_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="$GITHUB_WORKSPACE/TestResults/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**,**/*.Tests/**,**/*.Designer.cs" \
            /d:sonar.coverage.exclusions="**/*.Tests/**,**/Migrations/**" \
            /d:sonar.branch.name="${{ github.ref_name }}"

      - name: Build for SonarQube
        run: |
          dotnet build Login/Login.sln \
            --configuration Release \
            /p:NoWarn="CS8618"

      - name: Run Tests for Coverage
        run: |
          mkdir -p "$GITHUB_WORKSPACE/TestResults"
          dotnet test AreadePruebas/ProyectoHospital.Tests/ProyectoHospital.Tests.csproj \
            --configuration Release \
            --no-restore \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput="$GITHUB_WORKSPACE/TestResults/coverage.opencover.xml" \
            /p:NoWarn="CS8618"

      - name: SonarQube End Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # ============================================================
  # JOB 3: DOCKER IMAGE BUILD
  # ============================================================
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: proyectohospital:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`proyectohospital:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
