name: CI -- AuditoriaCalidad

on:
  push:
    branches:
      - AuditoriaCalidad
      - AuditoriaCalidad_Cypress
  pull_request:
    branches:
      - AuditoriaCalidad
      - main

jobs:
  # ============================================================
  # JOB 1: BUILD & UNIT TESTS (xUnit + Coverlet)
  # ============================================================
  build-and-test:
    name: Build & xUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Requerido por SonarCloud para blame info

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies (Solution)
        run: dotnet restore Login/Login.sln

      - name: Restore dependencies (Tests)
        run: dotnet restore AreadePruebas/ProyectoHospital.Tests/ProyectoHospital.Tests.csproj

      - name: Build solution
        run: dotnet build Login/Login.sln --configuration Release --no-restore

      - name: Run xUnit Tests with Coverage
        run: |
          dotnet test AreadePruebas/ProyectoHospital.Tests/ProyectoHospital.Tests.csproj \
            --configuration Release \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=TestResults/coverage.opencover.xml \
            /p:Exclude="[*.Tests]*"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage.opencover.xml

  # ============================================================
  # JOB 2: SONARCLOUD ANALYSIS
  # ============================================================
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: |
          dotnet restore Login/Login.sln
          dotnet restore AreadePruebas/ProyectoHospital.Tests/ProyectoHospital.Tests.csproj

      - name: SonarCloud Begin Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ secrets.SONAR_PROJECT_KEY }}" \
            /o:"${{ secrets.SONAR_ORGANIZATION }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**,**/*.Tests/**" \
            /d:sonar.coverage.exclusions="**/*.Tests/**" \
            /d:sonar.branch.name="${{ github.ref_name }}"

      - name: Build for SonarCloud
        run: dotnet build Login/Login.sln --configuration Release

      - name: Run Tests for SonarCloud Coverage
        run: |
          dotnet test AreadePruebas/ProyectoHospital.Tests/ProyectoHospital.Tests.csproj \
            --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=TestResults/coverage.opencover.xml

      - name: SonarCloud End Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # ============================================================
  # JOB 3: DOCKER IMAGE BUILD
  # ============================================================
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: proyectohospital:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`proyectohospital:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
