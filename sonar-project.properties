# sonar-project.properties
# Configuracion de SonarQube LOCAL para proyectoHospital
# projectKey debe coincidir con .sonarlint/Login.json -> "proyectoHospital"

# -------------------------------------------------------
# IDENTIFICACION DEL PROYECTO
# -------------------------------------------------------
sonar.projectKey=proyectoHospital
sonar.projectName=Sistema de Gestion Hospitalaria - SQAP
sonar.projectVersion=1.0

# -------------------------------------------------------
# SERVIDOR SONARQUBE
# La URL real se inyecta via secret SONAR_HOST_URL en GitHub Actions
# Para analisis local usa: http://localhost:9000
# -------------------------------------------------------
# sonar.host.url=http://localhost:9000

# -------------------------------------------------------
# FUENTES Y TESTS
# -------------------------------------------------------
sonar.sources=Login
sonar.tests=AreadePruebas
sonar.language=cs

# -------------------------------------------------------
# COBERTURA (Coverlet OpenCover format)
# -------------------------------------------------------
sonar.cs.opencover.reportsPaths=TestResults/coverage.opencover.xml

# -------------------------------------------------------
# EXCLUSIONES
# -------------------------------------------------------
sonar.exclusions=**/obj/**,**/bin/**,**/Migrations/**,**/*.Designer.cs
sonar.coverage.exclusions=**/*.Tests/**,**/Migrations/**

# -------------------------------------------------------
# ENCODING
# -------------------------------------------------------
sonar.sourceEncoding=UTF-8
