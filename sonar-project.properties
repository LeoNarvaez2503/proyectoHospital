# sonar-project.properties
# Configuracion de SonarCloud para proyectoHospital

# -------------------------------------------------------
# IDENTIFICACION DEL PROYECTO
# (Debe coincidir con los secrets SONAR_PROJECT_KEY y SONAR_ORGANIZATION de GitHub)
# -------------------------------------------------------
sonar.projectKey=LeoNarvaez2503_proyectoHospital
sonar.organization=leonarvaez2503
sonar.projectName=Sistema de Gestion Hospitalaria - SQAP
sonar.projectVersion=1.0

# -------------------------------------------------------
# FUENTES
# -------------------------------------------------------
sonar.sources=Login
sonar.tests=AreadePruebas
sonar.language=cs

# -------------------------------------------------------
# COBERTURA (Coverlet OpenCover format)
# -------------------------------------------------------
sonar.cs.opencover.reportsPaths=TestResults/coverage.opencover.xml

# -------------------------------------------------------
# EXCLUSIONES
# -------------------------------------------------------
sonar.exclusions=**/obj/**,**/bin/**,**/Migrations/**,**/*.Designer.cs
sonar.coverage.exclusions=**/*.Tests/**,**/Migrations/**

# -------------------------------------------------------
# ENCODING
# -------------------------------------------------------
sonar.sourceEncoding=UTF-8
